# Builds Hangar for Windows and publishes a GitHub release when a version tag (v1.2.3) is pushed.
# The tag must match the version in app/src-tauri/tauri.conf.json.
# Release notes come from .github/release-notes/<tag>.md if it exists.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match the app version $v" }

      - name: GPL notice in every source file
        working-directory: .
        run: python tools/gpl_headers.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - name: Type check (frontend)
        run: npm run check
      - name: Rust unit tests (temp folders only, no DCS needed)
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Build the exe and the installer
        run: npx tauri build --bundles nsis

      - name: Package
        run: |
          $v = "${{ github.ref_name }}"
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          $port = Join-Path $env:RUNNER_TEMP "Hangar-$v-portable"
          New-Item -ItemType Directory -Force $dist, $port | Out-Null
          Copy-Item src-tauri/target/release/hangar.exe (Join-Path $port "Hangar.exe")
          Copy-Item ../LICENSE, ../THIRD-PARTY-NOTICES.txt, ../README.md $port
          Compress-Archive -Path (Join-Path $port "*") -DestinationPath (Join-Path $dist "Hangar-$v-portable-x64.zip")
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "The NSIS installer was not built" }
          Copy-Item $setup.FullName (Join-Path $dist "Hangar-$v-setup-x64.exe")
          Get-ChildItem $dist | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } |
            Set-Content (Join-Path $dist "SHA256SUMS.txt")
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}"
          $title = "Hangar $($v.TrimStart('v'))"
          $assets = Get-ChildItem (Join-Path $env:RUNNER_TEMP "dist") | ForEach-Object FullName
          $notes = "../.github/release-notes/$v.md"
          if (Test-Path $notes) {
            gh release create $v @assets --title $title --notes-file $notes --verify-tag
          } else {
            gh release create $v @assets --title $title --generate-notes --verify-tag
          }
