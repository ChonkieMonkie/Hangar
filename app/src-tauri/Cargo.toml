[package]
name = "hangar"
version = "0.3.1"
description = "Hangar - a community-made updater & launcher for DCS World. Not affiliated with Eagle Dynamics SA."
authors = ["ChonkieMonkie"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
winreg = "0.55"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", features = ["zstdmt"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Graphics_Imaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

# Size guidance: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
